services:
  # 1. Express Backend Web Service
  - type: web
    name: tradevista-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URL
        sync: false
      - key: PORT
        value: 10000

  # 2. Frontend React Marketing Web App (Static Site)
  - type: web
    name: tradevista-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 3. Trading Dashboard React Web App (Static Site)
  - type: web
    name: tradevista-dashboard
    env: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: tradevista-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
